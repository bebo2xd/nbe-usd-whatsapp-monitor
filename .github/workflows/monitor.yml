name: NBE USD WhatsApp monitor
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read NBE only (no WhatsApp message or baseline update)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nbe-usd-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check configuration
        id: config
        env:
          API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Waiting for EVOLUTION_API_KEY secret." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install browser
        if: steps.config.outputs.ready == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check rate and notify
        if: steps.config.outputs.ready == 'true'
        env:
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
      - name: Persist delivered price
        if: steps.config.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update monitor state [skip ci]'
              git push origin HEAD:main
            fi
          fi
